<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页</title>
    <style>
        /* 简单内联样式 */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #f1f1f1;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #333;
            padding: 15px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>欢迎来到我的网站</h1>
    </header>

    <nav>
        <a href="#home">首页</a>
        <a href="#about">关于我们</a>
        <a href="#contact">联系我们</a>
    </nav>

    <div class="container">
        <h2>最新消息</h2>
        <p>这是一个简单的段落文本，用于演示HTML的基本结构。</p>
        
        <h3>功能特点</h3>
        <ul>
            <li>响应式设计</li>
            <li>清晰导航</li>
            <li>移动端友好</li>
        </ul>

        <h3>示例图片</h3>
        <img src="https://via.placeholder.com/400x200" alt="示例图片" style="max-width: 100%;">
    </div>

    <footer>
        <p>&copy; 2023 我的网站. 保留所有权利。</p>
    </footer>
</body>
</html>
